plugins {
    id 'net.fabricmc.fabric-loom-remap' version '1.18.2'
    id 'maven-publish'
}
version = project.mod_version
group = project.maven_group
base { archivesName = project.archives_base_name }
repositories { mavenCentral() }
dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
    options.compilerArgs += ['-Xmaxerrs', '1000']
}
java { withSourcesJar() }
jar { from('LICENSE') }

// Не тащим в jar мёртвые ресурсы: textures/cosmetics/item_*.png и
// textures/hud/music_girl/** не используются ни в коде, ни в моделях косметики.
// Файлы остаются в репозитории, но в сборку не попадают (минус ~7,6 МБ).
// Плюс сами PNG перепакованы lossless, а крупные атласы уменьшены до 1024 px.
tasks.named('processResources') {
    exclude 'assets/brokke/textures/cosmetics/item_*.png'   // 7 МБ мёртвых картинок
    exclude 'assets/brokke/textures/hud/music_girl/**'      // 0,6 МБ, нигде не используются
}
