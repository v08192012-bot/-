name: Build

on:
  push:
    branches:
      - main
      - 'arena/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Prepare Gradle
        run: |
          # путь к JDK в gradle.properties прописан под Windows — на CI убираем
          sed -i '/org.gradle.java.home/d' gradle.properties
          chmod +x gradlew
          java -version
          ./gradlew --version

      - name: Build
        run: |
          set -o pipefail
          ./gradlew build --no-daemon --stacktrace --console=plain 2>&1 | tee gradle.log

      - name: Collect jar
        if: success()
        run: |
          mkdir -p dist
          cp build/libs/*.jar dist/
          rm -f dist/*-sources.jar
          ls -lh dist

      - name: Upload artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: brokke-jar
          path: dist/*.jar
          if-no-files-found: error

      - name: Publish release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Brokke — latest build
          body: |
            Автосборка из ветки `${{ github.ref_name }}`, коммит ${{ github.sha }}.

            Установка: положить `brokke-*.jar` в папку `mods`.
          files: dist/*.jar
          fail_on_unmatched_files: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Report build errors
        if: failure()
        run: |
          echo "=== tail of gradle.log ==="
          tail -n 150 gradle.log 2>/dev/null || true
          echo "=== annotations ==="
          grep -nE "FAILURE:|What went wrong|Could not (resolve|download|find|create|copy)|error:|Caused by:|> Could not|Execution failed" gradle.log 2>/dev/null \
            | tail -n 40 \
            | cut -c1-900 \
            | while IFS= read -r line; do echo "::error::${line}"; done
