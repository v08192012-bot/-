name: Build

on:
  push:
    branches:
      - main
      - 'arena/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Prepare Gradle
        run: |
          # путь к JDK в gradle.properties прописан под Windows — на CI убираем
          sed -i '/org.gradle.java.home/d' gradle.properties
          chmod +x gradlew
          java -version
          ./gradlew --version

      - name: Build
        run: |
          set -o pipefail
          ./gradlew build --no-daemon --stacktrace --console=plain 2>&1 | tee gradle.log

      - name: Collect jar
        if: success()
        run: |
          mkdir -p dist
          cp build/libs/*.jar dist/
          rm -f dist/*-sources.jar
          ls -lh dist

      - name: Verify jar
        run: |
          JAR=$(ls dist/*.jar | head -n1)
          echo "JAR: $JAR"
          for cls in brokke/cc/module/render/Atmosphere.class brokke/cc/render/SnowRenderer.class brokke/cc/mixins/render/BlockColorsMixin.class assets/brokke/textures/snow/frost.png; do
            if unzip -l "$JAR" | grep -q "$cls"; then
              echo "::notice::OK: $cls present"
            else
              echo "::error::MISSING: $cls"
            fi
          done
          if unzip -p "$JAR" ez.mixins.json | grep -q 'render.BlockColorsMixin'; then
            echo "::notice::OK: ez.mixins.json references BlockColorsMixin"
          else
            echo "::error::ez.mixins.json has no BlockColorsMixin entry"
          fi
          # jar ремаппится в intermediary, поэтому проверяем исходник, из которого он собран:
          # покров обязан ставить настоящий ванильный слой снега, а не рисовать квады
          SRC=src/main/java/brokke/cc/render/SnowRenderer.java
          if grep -q 'renderBlockAsEntity' "$SRC" && grep -q 'SnowBlock.LAYERS' "$SRC"; then
            echo "::notice::OK: SnowRenderer places real vanilla snow layer blocks (renderBlockAsEntity + SnowBlock.LAYERS)"
          else
            echo "::error::SnowRenderer does not render the vanilla snow layer block"
            exit 1
          fi
          REFS=$(unzip -p "$JAR" brokke/cc/mixins/render/BlockColorsMixin.class | strings | grep -c 'method_' || true)
          NAMED=$(unzip -p "$JAR" brokke/cc/mixins/render/BlockColorsMixin.class | strings | grep -c 'getColor' || true)
          echo "::notice::BlockColorsMixin: intermediary refs=$REFS, named getColor refs=$NAMED"

      - name: Upload artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: brokke-jar
          path: dist/*.jar
          if-no-files-found: error

      - name: Publish release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Brokke — latest build
          body: |
            Автосборка из ветки `${{ github.ref_name }}`, коммит ${{ github.sha }}.

            Установка: положить `brokke-*.jar` в папку `mods`.
          files: dist/*.jar
          fail_on_unmatched_files: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Report build errors
        if: failure()
        run: |
          echo "=== tail of gradle.log ==="
          tail -n 150 gradle.log 2>/dev/null || true
          echo "=== annotations ==="
          grep -nE "FAILURE:|What went wrong|Could not (resolve|download|find|create|copy)|error:|Caused by:|> Could not|Execution failed" gradle.log 2>/dev/null \
            | tail -n 40 \
            | cut -c1-900 \
            | while IFS= read -r line; do echo "::error::${line}"; done

  warmup:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: warmup

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Prepare Gradle
        run: |
          # путь к JDK в gradle.properties прописан под Windows — на CI убираем
          sed -i '/org.gradle.java.home/d' gradle.properties
          chmod +x gradlew
          java -version
          ./gradlew --version

      - name: Build
        run: |
          set -o pipefail
          ./gradlew build --no-daemon --stacktrace --console=plain 2>&1 | tee gradle.log

      - name: Collect jar
        if: success()
        run: |
          mkdir -p dist
          cp build/libs/*.jar dist/
          rm -f dist/*-sources.jar
          ls -lh dist

      - name: Verify jar
        run: |
          JAR=$(ls dist/*.jar | head -n1)
          echo "JAR: $JAR"
          for entry in shelka/aim/ShelkaAim.class shelka/aim/core/WarmupBotEntity.class shelka/aim/core/WarmupBotTicker.class shelka/aim/mixins/network/ClientPlayerInteractionManagerMixin.class shelka_aim.mixins.json; do
            if unzip -l "$JAR" | grep -q "$entry"; then
              echo "::notice::OK: $entry present"
            else
              echo "::error::MISSING: $entry"
              exit 1
            fi
          done
          unzip -p "$JAR" fabric.mod.json > /tmp/aim-mod.json
          if grep -q 'shelka.aim.ShelkaAim' /tmp/aim-mod.json; then
            echo "::notice::OK: fabric.mod.json entrypoint"
          else
            echo "::error::fabric.mod.json has no shelka.aim.ShelkaAim entrypoint"
            exit 1
          fi
          # ${version} должен быть подставлен processResources, иначе лоадер не загрузит мод
          if grep -q '"version": "1.0.0"' /tmp/aim-mod.json && ! grep -q '\${version}' /tmp/aim-mod.json; then
            echo "::notice::OK: version expanded in fabric.mod.json"
          else
            echo "::error::fabric.mod.json version was not expanded"
            cat /tmp/aim-mod.json
            exit 1
          fi

      - name: Upload artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: shelka-aim-jar
          path: warmup/dist/*.jar
          if-no-files-found: error

      - name: Publish release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: shelka-aim-latest
          name: Shelka Aim — latest build
          body: |
            Отдельный мод для разминки аима. Коммит ${{ github.sha }}.

            Установка: положить `shelka-aim-*.jar` в папку `mods` (Fabric 1.21.11 + Fabric API).

            Команды: `.bot spawn [ник]`, `.bot remove`, `.bot clear`, `.bot move [on|off]`, `.bot speed <0.05-5.0>`.
          files: warmup/dist/*.jar
          fail_on_unmatched_files: true
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Report build errors
        if: failure()
        run: |
          echo "=== tail of gradle.log ==="
          tail -n 150 gradle.log 2>/dev/null || true
          echo "=== annotations ==="
          grep -nE "FAILURE:|What went wrong|Could not (resolve|download|find|create|copy)|error:|Caused by:|> Could not|Execution failed" gradle.log 2>/dev/null \
            | tail -n 40 \
            | cut -c1-900 \
            | while IFS= read -r line; do echo "::error::${line}"; done
